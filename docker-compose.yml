services:
  web:
    build: .
    container_name: foodgo-web
    ports:
      - "8080:80"
    environment:
      DB_HOST: db
      DB_NAME: foodgo
      DB_USER: foodgo_app
      DB_PASSWORD: ${FOODGO_DB_PASSWORD:?Set FOODGO_DB_PASSWORD in your environment}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
  db:
    image: mysql:8.4
    container_name: foodgo-db
    environment:
      MYSQL_DATABASE: foodgo
      MYSQL_USER: foodgo_app
      MYSQL_PASSWORD: ${FOODGO_DB_PASSWORD:?Set FOODGO_DB_PASSWORD in your environment}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in your environment}
    volumes:
      - foodgo_db_data:/var/lib/mysql
      - ./devsecops/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
volumes:
  foodgo_db_data:
